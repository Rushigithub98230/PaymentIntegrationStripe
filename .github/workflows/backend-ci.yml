name: Backend CI

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore PaymentIntegrationStripe.sln

      - name: Build
        run: dotnet build PaymentIntegrationStripe.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test PaymentIntegrationStripe.sln --configuration Release --no-build --verbosity normal
